<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fabrincando Loja de Fabrica Oficial - Supabase B2C</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box} body{margin:0; font-family:Inter,system-ui; background:#f8fafc}
.topbar{background:#0f172a; color:#fff; font-size:11px; padding:6px 14px; display:flex; gap:12px; justify-content:center; flex-wrap:wrap}
.header{background:#fff; position:sticky; top:0; z-index:30; box-shadow:0 2px 18px rgba(0,0,0,.06); padding:10px 14px; display:flex; gap:12px; align-items:center; flex-wrap:wrap}
.logo{font-weight:900; font-size:20px} .logo span{color:#e11d48}
.btn{border:none; border-radius:12px; padding:11px 14px; font-weight:700; cursor:pointer} .btn-dark{background:#0f172a; color:#fff} .btn-pink{background:#e11d48; color:#fff} .btn-outline{background:#fff; border:1px solid #e2e8f0}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px; padding:14px}
.card{background:#fff; border-radius:18px; overflow:hidden; box-shadow:0 4px 16px rgba(0,0,0,.06)}
.img-wrap{position:relative} .img-wrap img{width:100%; height:250px; object-fit:cover; display:block}
.off{position:absolute; left:10px; top:10px; background:#ef4444; color:#fff; font-weight:900; font-size:11px; padding:6px 9px; border-radius:10px}
.est{position:absolute; right:10px; top:10px; background:#22c55e; color:#fff; font-weight:800; font-size:11px; padding:6px 9px; border-radius:10px}
.info{padding:12px} .de{text-decoration:line-through; color:#94a3b8; font-size:12px} .por{font-size:22px; font-weight:900} .pix{color:#059669; font-size:12px; font-weight:700}
.cart{position:fixed; right:12px; top:72px; width:360px; max-width:92vw; background:#fff; border-radius:18px; box-shadow:0 20px 40px rgba(0,0,0,.18); padding:14px; display:none; z-index:40; max-height:82vh; overflow:auto} .cart.on{display:block}
.lightbox{position:fixed; inset:0; background:rgba(15,23,42,.85); display:none; z-index:60; align-items:center; justify-content:center} .lightbox.on{display:flex} .lightbox img{max-width:95vw; max-height:85vh; border-radius:14px}
</style>
</head>
<body>
<div class="topbar"><span>📞 (11) 2589-5150</span><span>📧 pedidos@fabrincandoideias.com.br</span><span>✅ SUPABASE ONLINE • carlos@fabrincandoideias.com.br</span><span id="connStatus">● conectando...</span></div>
<header class="header"><div class="logo">FABRIN<span>CANDO</span> LOJA OFICIAL</div><input id="busca" placeholder="Buscar Sereias, Bombeiros, Dinos..." oninput="renderGrid()" style="flex:1; min-width:200px; padding:10px 14px; border:1px solid #e2e8f0; border-radius:12px"><button class="btn btn-dark" onclick="toggleCart()">🛒 <span id="cartCount">0</span></button><button class="btn btn-pink" onclick="document.getElementById('grid').scrollIntoView({behavior:'smooth'})">Ver Produtos</button></header>
<div id="grid" class="grid"></div>
<div id="cart" class="cart"><div style="display:flex; justify-content:space-between"><b>Seu Carrinho</b><button class="btn btn-outline" onclick="toggleCart()">Fechar</button></div><div id="cartItems" style="margin-top:10px; display:grid; gap:8px"></div><div style="margin-top:10px; border-top:1px solid #e2e8f0; padding-top:10px"><div>Subtotal: <b id="cartSubtotal">R$ 0,00</b></div><div style="color:#059669">PIX 10% OFF: <b id="cartPix">R$ 0,00</b></div><button class="btn btn-pink" style="width:100%; margin-top:8px" onclick="finalizarPedido()">Finalizar no WhatsApp</button></div></div>
<div id="lightbox" class="lightbox" onclick="this.classList.remove('on')"><img id="lightImg" src=""></div>
<div id="iaFab" style="position:fixed; right:18px; bottom:18px; z-index:50"><button class="btn btn-pink" style="border-radius:999px; padding:14px 18px" onclick="toggleIA()">💬 Fale com a Fabrincando</button><div id="iaBox" style="display:none; width:360px; max-width:92vw; background:#fff; border-radius:18px; box-shadow:0 20px 40px rgba(0,0,0,.22); overflow:hidden; margin-bottom:10px"><div style="background:#0f172a; color:#fff; padding:12px; font-weight:800; display:flex; justify-content:space-between"><span>Agente IA Fabrincando</span><button class="btn btn-outline" style="padding:4px 8px" onclick="toggleIA()">Fechar</button></div><div id="iaChat" style="height:280px; overflow:auto; padding:10px; font-size:12px; display:grid; gap:8px; background:#f8fafc"></div><div style="display:flex; gap:6px; padding:8px; border-top:1px solid #e2e8f0"><input id="iaInput" placeholder="Pergunte: Sereias tem estoque?" style="flex:1; padding:10px; border:1px solid #e2e8f0; border-radius:10px" onkeydown="if(event.key==='Enter')enviarIA()"><button class="btn btn-dark" onclick="enviarIA()">Enviar</button></div></div></div>
<script>
const SUPABASE_URL = 'https://aicjdbvodbitpnoulgkh.supabase.co';
const SUPABASE_KEY = 'sb_publishable_penGBvW9YtQSRjBp2F9SvA_l01NdpOO';

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let produtos = [];
let carrinho = JSON.parse(localStorage.getItem('fabrincando_cart_v1')||'[]');
function br(n){return Number(n||0).toFixed(2).replace('.',',');}
function pct(de,por){if(!de||!por)return 0; return Math.round((1-por/de)*100);}
async function carregarProdutos(){
  document.getElementById('connStatus').textContent = '● carregando Supabase...';
  const {data,error} = await supabaseClient.from('produtos').select('*').eq('ativo',true).order('ref');
  if(error){document.getElementById('connStatus').textContent='● erro: '+error.message; return;}
  produtos=data;
  document.getElementById('connStatus').textContent='● ONLINE • '+data.length+' produtos • carlos@fabrincandoideias.com.br';
  renderGrid();
}
function getFoto(p){
  return SUPABASE_URL + '/storage/v1/object/public/produto-fotos/' + p.ref + '.jpg';
}
function renderGrid(){
  const q=(document.getElementById('busca').value||'').toLowerCase();
  const grid=document.getElementById('grid');
  grid.innerHTML='';
  let lista=produtos;
  if(q) lista=lista.filter(p=> (p.nome+' '+p.ref+' '+p.categoria).toLowerCase().includes(q));
  lista.forEach(p=>{
    const off=pct(p.preco_de,p.preco_por);
    const pix=p.preco_por*0.9;
    const card=document.createElement('div');
    card.className='card';
    card.innerHTML='<div class="img-wrap" onclick="openLight(\''+getFoto(p)+'\')"><img src="'+getFoto(p)+'" onerror="this.src=\'https://via.placeholder.com/600x500?text=REF+'+p.ref+'\'"><span class="off">'+off+'% OFF</span><span class="est">ESTOQUE '+(p.estoque||0)+'</span></div><div class="info"><div style="font-size:11px;color:#64748b">'+(p.categoria||'')+' • REF '+p.ref+'</div><div style="font-weight:800">'+p.nome+'</div><div class="de">De R$ '+br(p.preco_de)+'</div><div class="por">R$ '+br(p.preco_por)+' <span style="font-size:11px;background:#dcfce7;color:#166534;padding:3px 6px;border-radius:6px">PREÇO FÁBRICA</span></div><div class="pix">PIX R$ '+br(pix)+' • Desconto '+off+'% OFF editável (DE/POR livre)</div><div style="display:flex;gap:8px;margin-top:8px"><button class="btn btn-dark" style="flex:1" onclick="addCart(\''+p.ref+'\')">Adicionar</button><button class="btn btn-outline" onclick="openLight(\''+getFoto(p)+'\')">🔍</button></div></div>';
    grid.appendChild(card);
  });
}
function openLight(src){document.getElementById('lightImg').src=src; document.getElementById('lightbox').classList.add('on');}
function toggleCart(){document.getElementById('cart').classList.toggle('on'); renderCart();}
function addCart(ref){
  const p=produtos.find(x=>x.ref===ref); if(!p)return;
  const it=carrinho.find(x=>x.ref===ref);
  if(it)it.qtd++; else carrinho.push({ref,nome:p.nome,por:p.preco_por,qtd:1});
  localStorage.setItem('fabrincando_cart_v1',JSON.stringify(carrinho));
  renderCart(); document.getElementById('cart').classList.add('on');
}
function renderCart(){
  const el=document.getElementById('cartItems'); el.innerHTML='';
  let subtotal=0;
  carrinho.forEach((it,idx)=>{
    subtotal+=it.por*it.qtd;
    const div=document.createElement('div');
    div.style.cssText='display:flex;justify-content:space-between;gap:8px;background:#f8fafc;padding:8px;border-radius:10px;font-size:12px';
    div.innerHTML='<span><b>'+it.nome+'</b> (REF '+it.ref+') x '+it.qtd+'<br>R$ '+br(it.por)+'</span><button class="btn btn-outline" style="padding:4px 8px" onclick="removeCart('+idx+')">✕</button>';
    el.appendChild(div);
  });
  document.getElementById('cartSubtotal').textContent='R$ '+br(subtotal);
  document.getElementById('cartPix').textContent='R$ '+br(subtotal*0.9);
  document.getElementById('cartCount').textContent=carrinho.reduce((s,i)=>s+i.qtd,0);
}
function removeCart(i){carrinho.splice(i,1); localStorage.setItem('fabrincando_cart_v1',JSON.stringify(carrinho)); renderCart();}
function finalizarPedido(){
  const subtotal=carrinho.reduce((s,i)=>s+i.por*i.qtd,0);
  const pix=subtotal*0.9;
  const txt=encodeURIComponent('Olá Fabrincando! Pedido B2C Loja de Fábrica:\n'+carrinho.map(i=> '• REF '+i.ref+' '+i.nome+' x'+i.qtd+' R$ '+br(i.por)).join('\n')+'\nSubtotal R$ '+br(subtotal)+' | PIX R$ '+br(pix)+' (10% OFF)\nContato: carlos@fabrincandoideias.com.br / pedidos@fabrincandoideias.com.br');
  window.open('https://wa.me/551125895150?text='+txt,'_blank');
  window.location.href='mailto:pedidos@fabrincandoideias.com.br?subject=Pedido B2C Loja de Fábrica&body='+txt;
}
function toggleIA(){
  const box=document.getElementById('iaBox');
  box.style.display=box.style.display==='none'?'block':'none';
  if(box.style.display==='block' && document.getElementById('iaChat').children.length===0){
    addIAMsg('bot','Olá! Sou IA da Fabrincando 🏭\nTemos 6 produtos no Supabase: 6501 Bombeiros, 7102 Sereias, 9609 Dinos, 5250 Galinha, 0688 Cercado, 5441 Pizzaria. Mesmo valor para todos os temas, desconto editável livre (30%/42%/50% OFF). Qual tema quer? Estoque real!');
  }
}
function addIAMsg(who,text){
  const chat=document.getElementById('iaChat');
  const div=document.createElement('div');
  div.style.cssText=who==='bot' ? 'background:#fff;padding:8px;border-radius:10px;border:1px solid #e2e8f0' : 'background:#0f172a;color:#fff;padding:8px;border-radius:10px;margin-left:20px';
  div.innerText=text;
  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;
}
function enviarIA(){
  const input=document.getElementById('iaInput');
  const txt=input.value.trim(); if(!txt)return;
  addIAMsg('user',txt); input.value='';
  setTimeout(()=>{
    const lower=txt.toLowerCase();
    let resp='Temos 6 produtos ativos no Supabase carlos@fabrincandoideias.com.br: 6501,7102,9609,5250,0688,5441. Desconto editável livre por produto. Envio Santo André-SP para todo Brasil.';
    if(lower.includes('sereia')){const p=produtos.find(x=>x.ref==='7102'); resp='🧜‍♀️ REF 7102 Sereias - De R$ 189,90 por R$ 110,88 (41% OFF) - PIX R$ 99,79. Estoque '+(p?p.estoque:71)+' un. Mesmo preço Bombeiros/Dinos, só tema muda!';}
    if(lower.includes('bombeiro')){const p=produtos.find(x=>x.ref==='6501'); resp='🚒 REF 6501 Bombeiros - R$ 110,88 fábrica. Estoque '+(p?p.estoque:100)+' un. Posso adicionar no carrinho e enviar para pedidos@fabrincandoideias.com.br e WhatsApp (11) 2589-5150';}
    if(lower.includes('dino')){const p=produtos.find(x=>x.ref==='9609'); resp='🦕 REF 9609 Dinos Pop Up R$ 89,51 (De R$ 153,06) 41% OFF. Estoque '+(p?p.estoque:200)+' un no Supabase.';}
    addIAMsg('bot',resp+'\n\nQuer que eu monte pedido e envie para pedidos@fabrincandoideias.com.br?');
  },400);
}
carregarProdutos();
document.getElementById('cartCount').textContent=carrinho.reduce((s,i)=>s+i.qtd,0);
</script>
</body>
</html>
</html>
